<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Задачи форума</title><style>body{font:16px/1.5 system-ui;margin:28px;color:#213a32;background:#f5f7f5}h1{font-size:30px}#board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:20px}.col{background:#e5ece6;padding:18px;border-radius:12px}.card{background:white;padding:16px;margin:14px 0;border-radius:9px}label{display:block;font-size:13px;margin-top:9px}input,select{width:100%;padding:7px;box-sizing:border-box}button{padding:9px;margin-right:12px}summary{cursor:pointer}details{font-size:12px;margin-top:10px}@media(max-width:800px){#board{grid-template-columns:1fr}}</style><h1>Задачи проекта Без имени</h1><p>Локальная доска. Начальное состояние зафиксировано 21.09.2026. Последующие изменения сохраняются в этом браузере; для передачи команде используйте экспорт JSON. Пустые сроки требуют планирования.</p><button id="export">Экспорт JSON</button><label>Импорт JSON <input type="file" id="import" accept="application/json"></label><div id="board"></div><script>

PS", "title": "HTTPS, резервирование и месячное наблюдение", "owner": "Волентир А. Ф.", "area": "Приёмка", "due": "", "status": "План", "history": ["21.09.2026: ожидает отдельного стенда; срок назначается после его подготовки."]}];let tasks=JSON.parse(localStorage.getItem('forum-board-v1')||'null')||seed;const states=['План','В работе','Готово'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('board').innerHTML=states.map(s=>'<section class="col"><h2>'+s+'</h2>'+tasks.filter(t=>t.status===s).map(t=>'<article class="card"><b>'+esc(t.id)+' · '+esc(t.title)+'</b><p>'+esc(t.area)+'</p><label>Ответственный<input data-id="'+esc(t.id)+'" data-key="owner" value="'+esc(t.owner)+'"></label><label>Срок<input type="date" data-id="'+esc(t.id)+'" data-key="due" value="'+esc(t.due)+'"></label><label>Статус<select data-id="'+esc(t.id)+'" data-key="status">'+states.map(x=>'<option '+(x===s?'selected':'')+'>'+x+'</option>').join('')+'</select></label><details><summary>История</summary>'+t.history.map(x=>'<p>'+esc(x)+'</p>').join('')+'</details></article>').join('')+'</section>').join('')}
document.getElementById('board').addEventListener('change',e=>{let d=e.target.dataset;if(!d.id)return;let t=tasks.find(x=>x.id===d.id);t.history.push(new Date().toLocaleString('ru-RU')+': '+d.key+' '+t[d.key]+' → '+e.target.value);t[d.key]=e.target.value;localStorage.setItem('forum-board-v1',JSON.stringify(tasks));render()});
document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='forum-taskboard.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||x.some(t=>!states.includes(t.status)||!Array.isArray(t.history)))throw 0;tasks=x;localStorage.setItem('forum-board-v1',JSON.stringify(tasks));render()}catch{alert('Неверный файл доски')}};render();</script></html>
